[package]
name = "ccflare-desktop"
version = "1.0.0"
description = "ccflare Desktop - Load balancer proxy for Claude with desktop interface"
authors = ["ccflare team"]
license = "MIT"
repository = "https://github.com/your-org/ccflare"
edition = "2021"

[lib]
name = "ccflare_desktop_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ccflare-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [], default-features = false }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = ["config-json5"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"  
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-window-state = "2.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
